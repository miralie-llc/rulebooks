name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
      - name: Install checksum-pinned credential scanner
        run: python tools/install_gitleaks.py
      - name: Check credentials, maintained links and work records
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$REVIEW_BASE" ] || [ "$REVIEW_BASE" = "0000000000000000000000000000000000000000" ]; then
            python tools/prepublish.py --candidate head --all-history
          else
            python tools/prepublish.py --candidate head --base "$REVIEW_BASE"
          fi
      - name: Test publication contracts and contribution boundaries
        run: python -m unittest discover -s tests -v
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install site dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static site and check routes
        run: |
          npm run build
          npm run test:site
          python tests/check_site_fixtures.py
